# EventPlaybook runs on Render with its own embedded SQLite file.
# The SQLite database file is created locally by the app.
# NOTE: Render free instances have an ephemeral filesystem; see DEPLOY.md.
services:
  - type: web
    name: eventplaybook
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
